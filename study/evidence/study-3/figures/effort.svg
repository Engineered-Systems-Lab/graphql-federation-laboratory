<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 224" width="720" height="224" role="img" aria-label="Confirmatory: federation over each comparison arm">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--fig-text,#222)}.t{font-size:15px;font-weight:600}.s{font-size:11px;fill:var(--fig-muted,#6b6b6b)}</style>
<rect x="0" y="0" width="720" height="224" fill="var(--fig-bg,#ffffff)"/>
<text class="t" x="16" y="26">Confirmatory: federation over each comparison arm</text>
<line x1="230.0" y1="48" x2="230.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="230.0" y="192" text-anchor="middle">0</text>
<line x1="342.5" y1="48" x2="342.5" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="342.5" y="192" text-anchor="middle">0.5</text>
<line x1="455.0" y1="48" x2="455.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="455.0" y="192" text-anchor="middle">1</text>
<line x1="567.5" y1="48" x2="567.5" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="567.5" y="192" text-anchor="middle">1.5</text>
<line x1="680.0" y1="48" x2="680.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="680.0" y="192" text-anchor="middle">2</text>
<text class="s" x="455.0" y="210" text-anchor="middle">ratio of geometric means (95% interval); below 1 is less effort</text>
<text x="218" y="67.0" text-anchor="end" dominant-baseline="middle">P1 1 + tool calls per run</text>
<line x1="384.9" y1="67.0" x2="402.5" y2="67.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="393.5" cy="67.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="97.0" text-anchor="end" dominant-baseline="middle">P2 1 + tool calls per run</text>
<line x1="490.2" y1="97.0" x2="552.3" y2="97.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="519.6" cy="97.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="127.0" text-anchor="end" dominant-baseline="middle">P1 cost per run (USD)</text>
<line x1="391.2" y1="127.0" x2="416.7" y2="127.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="403.5" cy="127.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="157.0" text-anchor="end" dominant-baseline="middle">P2 cost per run (USD)</text>
<line x1="402.6" y1="157.0" x2="439.8" y2="157.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="420.3" cy="157.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
</svg>
