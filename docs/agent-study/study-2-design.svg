<rect class="panel" x="0.5" y="0.5" width="759" height="575" rx="8"/>
<text class="t" x="20" y="32">Study 2 (study-2): a Williams square in four rounds, then a reference block</text>
<text class="m" x="20" y="52">Every arm has the same calculate tool, ask_requester tool, system prompt, limits and two models</text>
<text class="m" x="20" y="68">(Claude Sonnet 5.5 and GPT-6.1 Sol, pinned). Arms are named; the internal identifier follows in grey.</text>
<rect class="card" x="20" y="84" width="320" height="282" rx="6"/>
<text class="h" x="32" y="106">The four full arms</text>
<text class="b" x="32" y="128">GraphQL Adapters <tspan class="s m">Gamma</tspan></text>
<text class="s" x="32" y="143">the four adapters as separate GraphQL APIs</text>
<text class="b" x="32" y="166">Guided Direct Access <tspan class="s m">Beta</tspan></text>
<text class="s" x="32" y="181">raw SOAP and REST, with a new guide written blind</text>
<text class="b" x="32" y="204">Apollo Federation <tspan class="s m">Delta</tspan></text>
<text class="s" x="32" y="219">the adapters behind Apollo Router v2.18.0</text>
<text class="b" x="32" y="242">Cosmo Federation <tspan class="s m">Epsilon</tspan></text>
<text class="s" x="32" y="257">the adapters behind Cosmo Router 0.359.0</text>
<text class="b" x="32" y="284">The seed</text>
<text class="s" x="32" y="300">The scored run's seed assigns these four arms to the</text>
<text class="s" x="32" y="315">letters a to d of the square, and sets the order in</text>
<text class="s" x="32" y="330">which the four rounds run. The square on the right is</text>
<text class="s" x="32" y="345">what the design fixes; it shows no assignment.</text>
<text class="s m" x="360" y="100">Round (half)</text>
<text class="s m" x="476" y="100">Position 1</text>
<text class="s m" x="548" y="100">Position 2</text>
<text class="s m" x="620" y="100">Position 3</text>
<text class="s m" x="692" y="100">Position 4</text>
