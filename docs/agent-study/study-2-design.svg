<text class="L" x="679" y="284">b</text><text class="s" x="693" y="293">27 runs</text>
<text class="s m" x="452" y="322">16 blocks, one start of an arm's access layer each</text>
<line class="arrow" x1="593" y1="328" x2="593" y2="344" stroke-width="1.5"/>
<path class="head" d="M593 352 L588 342 L598 342 Z"/>
<text class="s m" x="360" y="374">then, last</text>
<rect class="ref" x="452" y="356" width="282" height="76" rx="6"/>
<text class="b" x="464" y="376">Direct Access <tspan class="s m">Alpha</tspan></text>
<text class="s" x="464" y="392">one block, after all four rounds:</text>
<text class="s" x="464" y="407">54 tasks &#215; 2 models = <tspan class="b">108 runs</tspan></text>
<text class="s" x="464" y="422">an exploratory reference</text>
<g transform="translate(0,16)">
<rect class="card" x="20" y="430" width="720" height="82" rx="6"/>
<text x="32" y="450">Halves: rounds 1 and 3 run H1, rounds 2 and 4 run H2, 27 tasks each, stratified by category, size and</text>
<text x="32" y="466">system; each half stays with its pair of rows whatever order the rounds run in. Within a half, a task runs</text>
<text x="32" y="482">with Claude in one of its two rounds and with GPT in the other, so each task meets each arm once per model.</text>
<text x="32" y="498">The four blocks of a round run the same 27 tasks. Each arm sits once in every position and follows each other arm once.</text>
<text class="b" x="20" y="536">study-2: 16 blocks &#215; 27 runs = 432, plus the Direct Access block of 108 = 540 runs, one at a time</text>
</g>
</svg>
