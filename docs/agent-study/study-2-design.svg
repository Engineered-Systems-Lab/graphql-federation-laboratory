<text class="L" x="463" y="234">c</text><text class="s" x="477" y="243">27 runs</text>
<rect class="kd" x="524" y="208" width="66" height="44" rx="5"/>
<text class="L" x="535" y="234">d</text><text class="s" x="549" y="243">27 runs</text>
<rect class="kb" x="596" y="208" width="66" height="44" rx="5"/>
<text class="L" x="607" y="234">b</text><text class="s" x="621" y="243">27 runs</text>
<rect class="ka" x="668" y="208" width="66" height="44" rx="5"/>
