<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 576" width="760" height="576" role="img" aria-labelledby="s2-title s2-desc">
<title id="s2-title">Study 2 design: a Williams square in four rounds, then a Direct Access block</title>
<desc id="s2-desc">The design of Abstraction ladder study 2 (run study-2). Four full arms, GraphQL Adapters, Guided Direct Access, Apollo Federation and Cosmo Federation, run in four rounds of four blocks laid out as a Williams Latin square with the letters a to d. Rounds 1 and 3 run half H1 of the tasks and rounds 2 and 4 run half H2, 27 tasks each, so every block is 27 runs. The scored run's seed assigns the four arms to the letters and sets the order in which the rounds run; the diagram shows no assignment. After all four rounds one Direct Access block runs all 54 tasks with both models, 108 runs, as an exploratory reference. In all 540 runs, one at a time. No results are shown.</desc>
