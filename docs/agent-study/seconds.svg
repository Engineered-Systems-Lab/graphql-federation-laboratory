<line x1="680.0" y1="48" x2="680.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="680.0" y="192" text-anchor="middle">60</text>
<text class="s" x="455.0" y="210" text-anchor="middle">run time (s), 95% interval</text>
<text x="218" y="67.0" text-anchor="end" dominant-baseline="middle">Alpha</text>
<line x1="417.0" y1="67.0" x2="626.8" y2="67.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="502.4" cy="67.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="97.0" text-anchor="end" dominant-baseline="middle">Beta</text>
