<circle cx="370.1" cy="97.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="127.0" text-anchor="end" dominant-baseline="middle">Delta</text>
<line x1="361.4" y1="127.0" x2="501.1" y2="127.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
<circle cx="418.7" cy="127.0" r="5" fill="var(--fig-ink, #1f4e79)"/>
<text x="218" y="157.0" text-anchor="end" dominant-baseline="middle">Epsilon</text>
<line x1="362.4" y1="157.0" x2="484.1" y2="157.0" stroke="var(--fig-ink, #1f4e79)" stroke-width="2.5" stroke-dasharray="none"/>
