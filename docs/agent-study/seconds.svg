<line x1="305.0" y1="48" x2="305.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="305.0" y="192" text-anchor="middle">10</text>
<line x1="380.0" y1="48" x2="380.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
<text class="s" x="380.0" y="192" text-anchor="middle">20</text>
<line x1="455.0" y1="48" x2="455.0" y2="176" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
