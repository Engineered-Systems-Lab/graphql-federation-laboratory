<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 302" width="720" height="302" role="img" aria-label="Confirmatory comparisons">
<style>text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:13px;fill:var(--fig-text,#222)}.t{font-size:15px;font-weight:600}.s{font-size:11px;fill:var(--fig-muted,#6b6b6b)}</style>
<rect x="0" y="0" width="720" height="302" fill="var(--fig-bg,#ffffff)"/>
<text class="t" x="16" y="26">Confirmatory comparisons</text>
<rect x="387.5" y="48" width="135.0" height="188" fill="var(--fig-band,#1f4e79)" fill-opacity="0.07"/>
<rect x="410.0" y="48" width="90.0" height="188" fill="var(--fig-band,#1f4e79)" fill-opacity="0.10"/>
<line x1="230.0" y1="48" x2="230.0" y2="236" stroke="var(--fig-grid,#d0d0d0)" stroke-width="1"/>
