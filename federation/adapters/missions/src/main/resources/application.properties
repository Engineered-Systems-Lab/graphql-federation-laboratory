spring.main.banner-mode=off
spring.application.name=federation-missions-adapter
# 8183 mirrors the legacy Missions port 8083. Inside a container the bind host is 0.0.0.0 and compose publishes on loopback only.
server.port=${ADAPTER_PORT:8183}
server.address=${ADAPTER_BIND_HOST:127.0.0.1}
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
# The Missions service, and short client timeouts (milliseconds). The experiments used connect 1 s and read 1.5 s.
missions.service-url=${MISSIONS_SERVICE_URL:http://127.0.0.1:8083}
missions.connect-timeout-ms=${MISSIONS_CONNECT_TIMEOUT_MS:1000}
missions.read-timeout-ms=${MISSIONS_READ_TIMEOUT_MS:1500}
