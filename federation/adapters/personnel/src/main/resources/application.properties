spring.main.banner-mode=off
spring.application.name=federation-personnel-adapter
# 8182 mirrors the legacy Personnel v2 port 8082. Inside a container the bind host is 0.0.0.0 and compose publishes on loopback only.
server.port=${ADAPTER_PORT:8182}
server.address=${ADAPTER_BIND_HOST:127.0.0.1}
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
# The Personnel v2 SOAP service, and short client timeouts (milliseconds).
personnel.service-url=${PERSONNEL_SERVICE_URL:http://127.0.0.1:8082/soap/personnel-v2}
personnel.connect-timeout-ms=${PERSONNEL_CONNECT_TIMEOUT_MS:1000}
personnel.read-timeout-ms=${PERSONNEL_READ_TIMEOUT_MS:1500}
