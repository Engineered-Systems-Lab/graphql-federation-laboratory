spring.main.banner-mode=off
spring.application.name=federation-mapping-adapter
# 8190 is the first port of the block for federation-only services: the mapping adapter has no legacy twin. Inside a container the
# bind host is 0.0.0.0 and compose publishes on loopback only.
server.port=${ADAPTER_PORT:8190}
server.address=${ADAPTER_BIND_HOST:127.0.0.1}
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
# The folder of the immutable MAJOR.MINOR releases. The image bakes federation/mapping-releases into /app/mapping-releases.
mapping.releases-dir=${MAPPING_RELEASES_DIR:/app/mapping-releases}
