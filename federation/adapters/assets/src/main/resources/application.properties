spring.main.banner-mode=off
spring.application.name=federation-assets-adapter
# 8184 mirrors the legacy Assets port 8084. Inside a container the bind host is 0.0.0.0 and compose publishes on loopback only.
server.port=${ADAPTER_PORT:8184}
server.address=${ADAPTER_BIND_HOST:127.0.0.1}
spring.graphql.path=/graphql
spring.graphql.graphiql.enabled=false
# The Assets service, and short client timeouts (milliseconds). The experiments used connect 1 s and read 1.5 s.
assets.service-url=${ASSETS_SERVICE_URL:http://127.0.0.1:8084}
assets.connect-timeout-ms=${ASSETS_CONNECT_TIMEOUT_MS:1000}
assets.read-timeout-ms=${ASSETS_READ_TIMEOUT_MS:1500}
