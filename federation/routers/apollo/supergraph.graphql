type Asset
  @join__type(graph: ASSETS, key: "assetId", resolvable: true)
{
  assetId: ID!
  category: AssetCategory!
  description: String!
  kind: AssetKind!
  name: String!

  """
  The parent asset, read from the Assets service with ONE call per level and only when the client selects it. A parent id that
  does not exist is null with no errors entry; a failed call is null with one SERVICE_UNAVAILABLE entry. No caching, no batching.
  """
  parent: Asset
  parentAssetId: ID
  status: AssetStatus!
}

enum AssetCategory
  @join__type(graph: ASSETS)
{
  EQUIPMENT @join__enumValue(graph: ASSETS)
  VEHICLE @join__enumValue(graph: ASSETS)
}

enum AssetKind
  @join__type(graph: ASSETS)
{
  ARMORED_VEHICLE @join__enumValue(graph: ASSETS)
  COMMUNICATOR @join__enumValue(graph: ASSETS)
  MUSICAL_INSTRUMENT @join__enumValue(graph: ASSETS)
  PHASER @join__enumValue(graph: ASSETS)
  ROVER @join__enumValue(graph: ASSETS)
  SCIENTIFIC_INSTRUMENT @join__enumValue(graph: ASSETS)
  SHUTTLE @join__enumValue(graph: ASSETS)
  STARSHIP @join__enumValue(graph: ASSETS)
  TRICORDER @join__enumValue(graph: ASSETS)
}

"""
What a mission's asset reference becomes. The mapping subgraph supplies assetId and mappingOutcome; this adapter produces the
whole outcome with at most one call to the Assets service. The mapping release is a key field. The identifier the mapping found
is assetId (the confirmed asset is asset.assetId); there is no separate id field.
"""
type AssetReference
  @join__type(graph: ASSETS, key: "localRef release", resolvable: true)
  @join__type(graph: MAPPING, key: "localRef release", resolvable: true)
  @join__type(graph: MISSIONS, key: "localRef release", resolvable: false)
{
  asset: Asset @join__field(graph: ASSETS, requires: "assetId mappingOutcome")

  """ The Assets identifier the release maps the reference to; null unless mappingOutcome is MAPPED.
  """
  assetId: ID @join__field(graph: ASSETS, external: true) @join__field(graph: MAPPING)
  localRef: ID!
  mappingOutcome: MappingOutcome! @join__field(graph: ASSETS, external: true) @join__field(graph: MAPPING)
  release: String!

  """
  Nullable on purpose: this adapter never returns null here. A null resolution means ONLY that the router could not ask this
  adapter (a dead subgraph); the errors entry says why and names the subgraph. Every other case is an explicit value.
  """
  resolution: Resolution @join__field(graph: ASSETS, requires: "assetId mappingOutcome")
}

