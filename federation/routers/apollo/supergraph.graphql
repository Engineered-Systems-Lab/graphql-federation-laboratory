""" One person. details is the contract's choice: exactly one of crewDetails and civilianDetails.
"""
type Personnel
  @join__type(graph: PERSONNEL, key: "personnelId", resolvable: true)
{
  details: PersonnelDetails!
  displayName: String!
  dutyStatus: DutyStatus!
  personnelId: ID!
  positionTitle: String!
}

union PersonnelDetails
  @join__type(graph: PERSONNEL)
  @join__unionMember(graph: PERSONNEL, member: "CivilianDetails")
  @join__unionMember(graph: PERSONNEL, member: "CrewDetails")
 = CivilianDetails | CrewDetails

"""
A page of the roster. datasetVersion is the opaque, immutable identifier of the snapshot that answered. The adapter holds no state,
so it cannot see a change between two pages of a client: the client compares datasetVersion on every page and restarts at offset 0
when it changes (the contract says so).
"""
type PersonnelPage
  @join__type(graph: PERSONNEL)
{
  datasetVersion: String!
  hasMore: Boolean!
  items: [Personnel!]!
  limit: Int!
  offset: Int!
  totalCount: Int!
}

"""
The crew reference. The Personnel adapter declares personnelId and mappingOutcome @external and uses
@requires(fields: "personnelId mappingOutcome"). The crew section of release 1.1 gives the Personnel v2 identifier PRS-nnnn; a
release without a crew section (1.0) or without an entry for the reference is NO_ENTRY.
"""
type PersonnelReference
  @join__type(graph: MAPPING, key: "localRef release", resolvable: true)
  @join__type(graph: MISSIONS, key: "localRef release", resolvable: false)
  @join__type(graph: PERSONNEL, key: "localRef release", resolvable: true)
{
  localRef: ID!
  mappingOutcome: MappingOutcome! @join__field(graph: MAPPING) @join__field(graph: PERSONNEL, external: true)
  personnelId: ID @join__field(graph: MAPPING) @join__field(graph: PERSONNEL, external: true)
  release: String!
  personnel: Personnel @join__field(graph: PERSONNEL, requires: "personnelId mappingOutcome")

  """
  Nullable on purpose: this adapter never returns null here. A null resolution means ONLY that the router could not ask this
  adapter (a dead subgraph); the errors entry says why and names the subgraph. Every other case is an explicit value.
  """
  resolution: Resolution @join__field(graph: PERSONNEL, requires: "personnelId mappingOutcome")
}

""" The Assets subgraph. The names are those of the Assets contract 1.1 (assets-v1.1.openapi.json).
"""
type Query
  @join__type(graph: ASSETS)
  @join__type(graph: MAPPING)
  @join__type(graph: MISSIONS)
  @join__type(graph: PERSONNEL)
{
  asset(assetId: ID!): Asset @join__field(graph: ASSETS)

  """
  Offset and limit at the graph level: the default limit is 20, the maximum 100. A page above 50 takes two calls to the
  service. All or nothing: if any call of the page fails the whole list is null, with one errors entry.
  """
  assets(category: AssetCategory, kind: AssetKind, limit: Int = 20, offset: Int = 0, parentAssetId: ID, status: AssetStatus): [Asset!] @join__field(graph: ASSETS)

  """
  Missions-local asset references (for example EQ-64) to Assets identifiers (AST-nnnn) in the named mapping release: for each
  reference, in the order given, its assetId and mappingOutcome. The release is required (there is no implicit latest; a blank or
  unknown release is RELEASE_REFUSED). At most 100 references in one call; more is BAD_USER_INPUT and the list is null.
  """
  assetReferences(localRefs: [ID!]!, release: String!): [AssetReference!] @inaccessible @join__field(graph: MAPPING)

  """ A diagnostic list of the releases this adapter serves."""
  mappingReleases: [MappingRelease!]! @join__field(graph: MAPPING)

  """
  Missions-local crew references (C-n) to Personnel v2 identifiers (PRS-nnnn) from the crew section of the named mapping release:
  for each reference, in the order given, its personnelId and mappingOutcome, with the same release rule and limit. A participant
  reference (P-n) is not resolved by the graph and an outsider reference (O-n) is refused by class: both answer NO_ENTRY, with the
  errors entry MAPPING_CLASS_REFUSED.
  """
  personnelReferences(localRefs: [ID!]!, release: String!): [PersonnelReference!] @inaccessible @join__field(graph: MAPPING)

  """ A mission that does not exist is null with no errors entry: not-found is data. A malformed id is BAD_USER_INPUT.
  """
  mission(missionId: ID!): Mission @join__field(graph: MISSIONS)

  """
  Offset and limit at the graph level: the default limit is 20, the maximum 100. The service pages by page and pageSize (1 to 50),
  so the adapter fetches the covering pages and slices. All or nothing: if any call of the page fails the whole list is null,
  with one errors entry. The order is the service's: stardate, priority, missionId, ascending.
  """
  missions(assignedAssetId: String, assignedCrewId: String, classification: Classification, commandingOfficerId: String, issuingAuthority: IssuingAuthority, limit: Int = 20, locationType: LocationType, offset: Int = 0, priority: Int, status: MissionStatus, type: MissionType): [Mission!] @join__field(graph: MISSIONS)
  personnel(personnelId: ID!): Personnel @join__field(graph: PERSONNEL)

  """
  Offset and limit at the graph level: the default limit is 20, the maximum 100, and the service allows 100 per call, so a page
  is one call. All or nothing: if the call fails the whole result is null, with one errors entry.
  """
  personnelMembers(department: Department, dutyStatus: DutyStatus, limit: Int = 20, offset: Int = 0): PersonnelPage @join__field(graph: PERSONNEL)
}

