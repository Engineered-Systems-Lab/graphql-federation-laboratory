# The real-Missions mode of start.sh (MISSIONS_BACKEND=real): an overlay of compose.yaml, which it never changes.
# start.sh adds it to every compose call of the real mode (-f federation/stack/compose.yaml -f federation/stack/missions-real.compose.yaml).
# The study launch kit keeps its own copy (study/launch/missions-real.compose.yaml); neither file reads the other.
#
# - The Missions adapter calls the real Missions service instead of missions-stub, by its container name on the service's own bridge
#   network. uss-enterprise/missions/compose.yaml (project starfleet-missions) creates that network as its default network, beside
#   Oracle's internal network starfleet-missions-data-20261009; the adapter joins the bridge only, so it cannot reach Oracle.
# - depends_on is reset, so starting the adapter (or a router, which depends on it) never starts missions-stub. !reset needs
#   Docker Compose 2.24.4 or later; start.sh checks the version.
# - Nothing is published here: every port stays as compose.yaml publishes it, on 127.0.0.1. The real service publishes
#   127.0.0.1:8083 itself.
# - The operator starts Oracle and the Missions service; this file and start.sh never start, stop, create or remove either. The
#   network is external, so compose refuses to start the adapter when the service's network does not exist.
services:
  missions-adapter:
    environment:
      MISSIONS_SERVICE_URL: http://starfleet-missions-service:8083
    depends_on: !reset {}
    networks:
      - default
      - missions-service

networks:
  missions-service:
    external: true
    name: starfleet-missions_default
